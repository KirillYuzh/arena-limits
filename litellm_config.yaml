model_list:
  - model_name: gigachat-2
    litellm_params:
      model: gigachat/GigaChat-2
      api_key: os.environ/GIGACHAT_CREDENTIALS
      ssl_verify: false

  - model_name: gigachat-3-lightning
    litellm_params:
      model: gigachat/GigaChat-3-Lightning
      api_key: os.environ/GIGACHAT_CREDENTIALS
      ssl_verify: false

  - model_name: gigachat-2-max
    litellm_params:
      model: gigachat/GigaChat-2-Max
      api_key: os.environ/GIGACHAT_CREDENTIALS
      ssl_verify: false

general_settings:
  master_key: os.environ/LITELLM_API_KEY
