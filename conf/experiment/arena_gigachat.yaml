experiment_id: arena_gigachat

scenario:
  scenario_id: parts_nego_v1
  item: industrial spare parts lot
  floor_price: 100.0
  opening_offer: 60.0
  target_offer: 95.0
  max_rounds: 5

opponents:
  - { opponent_id: opp_lowball, strategy: lowball }
  - { opponent_id: opp_aggressive, strategy: aggressive }
  - { opponent_id: opp_guilt, strategy: guilt_trip }

agent_pool:
  - {
      agent_id: g2_soft,
      model: gigachat/GigaChat-2,
      prompt_template: soft,
      backbone: GigaChat-2,
    }
  - {
      agent_id: g2_neutral,
      model: gigachat/GigaChat-2,
      prompt_template: neutral,
      backbone: GigaChat-2,
    }
  - {
      agent_id: g2_strict,
      model: gigachat/GigaChat-2,
      prompt_template: strict,
      backbone: GigaChat-2,
    }
  - {
      agent_id: gp_soft,
      model: gigachat/GigaChat-2-Pro,
      prompt_template: soft,
      backbone: GigaChat-2-Pro,
    }
  - {
      agent_id: gp_neutral,
      model: gigachat/GigaChat-2-Pro,
      prompt_template: neutral,
      backbone: GigaChat-2-Pro,
    }
  - {
      agent_id: gp_strict,
      model: gigachat/GigaChat-2-Pro,
      prompt_template: strict,
      backbone: GigaChat-2-Pro,
    }

K: 5

storage:
  path: arena_gigachat.duckdb
